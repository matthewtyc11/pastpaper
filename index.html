<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>免費歷屆試題庫系統</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; display: flex; height: 100vh; box-sizing: border-box; }
    /* 左側控制面板 */
    .sidebar { width: 35%; background: white; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; border-radius: 8px; overflow-y: auto; }
    /* 右側 PDF 線上觀看區 */
    .viewer-panel { width: 65%; margin-left: 20px; background: #e9ecef; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; }
    iframe { width: 100%; height: 100%; border: none; border-radius: 8px; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background: #0056b3; }
    
    /* 檔案列表樣式 */
    .file-list { margin-top: 25px; flex-grow: 1; }
    .file-item { padding: 12px; background: #f8f9fa; margin-bottom: 8px; border-radius: 4px; cursor: pointer; border-left: 4px solid #007bff; transition: 0.2s; display: flex; justify-content: space-between; align-items: center;}
    .file-item:hover { background: #e2e6ea; }
    .placeholder-text { color: #6c757d; font-size: 18px; }
  </style>
</head>
<body>

  <!-- 左邊：功能與列表區 -->
  <div class="sidebar">
    <h2>📚 歷屆試題庫</h2>
    
    <!-- 上傳表單 -->
    <div style="background: #fff3cd; padding: 15px; border-radius: 6px; border: 1px solid #ffeeba;">
      <h3 style="margin-top:0;">新增試卷</h3>
      <div class="form-group">
        <label>1. 選擇試卷檔案 (PDF):</label>
        <input type="file" id="examFile" accept=".pdf" />
      </div>
      <div class="form-group">
        <label>2. 自訂這份檔案的名稱:</label>
        <input type="text" id="customName" placeholder="例如：2025DSE_數學_卷一_答案" />
      </div>
      <button onclick="handleUpload()">確認上傳</button>
      <p id="statusMessage" style="font-size: 13px; color: #666; margin-top: 10px;"></p>
    </div>

    <!-- 試卷清單展示 -->
    <div class="file-list">
      <h3>現有試卷清單 (點擊立刻線上看)</h3>
      <div id="listContainer">正在載入試卷清單...</div>
    </div>
  </div>

  <!-- 右邊：線上看檢視區 -->
  <div class="viewer-panel" id="viewerPanel">
    <div class="placeholder-text" id="placeholderText">👈 請點擊左側的試卷名稱來線上瀏覽</div>
  </div>

  <!-- 前端 JavaScript 整合區 -->
  <script>
    // ⚠️ 請確保這網址是你在 Google Apps Script 重新部署後拿到的全新網址！
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyR6r33DAdATfV-Dpf5yrXa2-1fBZqUn2qCMczNAHdoOGGRX7WUfdQWhkXLNy_iQg/exec";

    document.addEventListener("DOMContentLoaded", loadFileList);

    function loadFileList() {
      const listContainer = document.getElementById('listContainer');
      
      fetch(GOOGLE_SCRIPT_URL, {
        method: 'GET',
        redirect: 'follow'
      })
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success' && data.files.length > 0) {
            listContainer.innerHTML = "";
            data.files.forEach(file => {
              const item = document.createElement('div');
              item.className = 'file-item';
              item.innerHTML = `<span>📄 ${file.name}</span> <small style="color:#007bff; font-weight:bold;">線上看</small>`;
              item.onclick = function() { openPdfViewer(file.url); };
              listContainer.appendChild(item);
            });
          } else {
            listContainer.className = "placeholder-text";
            listContainer.style.fontSize = "14px";
            listContainer.innerText = "目前資料庫內還沒有檔案，歡迎成為第一位貢獻者！";
          }
        })
        .catch(err => {
          console.error(err);
          listContainer.innerText = "無法同步雲端清單，連線可能被阻擋。";
        });
    }

    function openPdfViewer(embedUrl) {
      const viewerPanel = document.getElementById('viewerPanel');
      viewerPanel.innerHTML = `<iframe src="${embedUrl}" allow="autoplay"></iframe>`;
    }

    function handleUpload() {
      const fileInput = document.getElementById('examFile');
      const nameInput = document.getElementById('customName');
      const statusText = document.getElementById('statusMessage');
      
      if (fileInput.files.length === 0) { return alert("請先選擇一個 PDF 檔案！"); }
      if (!nameInput.value.trim()) { return alert("請輸入自訂的試卷檔案名稱！"); }

      const file = fileInput.files[0];
      const extension = file.name.substring(file.name.lastIndexOf('.'));
      
      statusText.style.color = "#007bff";
      statusText.innerText = "正在將檔案打包加密中...";
      
      const reader = new FileReader();
      reader.onload = function(event) {
        const base64String = event.target.result.split(',')[1];
        
        const payload = {
          customName: nameInput.value.trim(),
          fileName: file.name,
          fileExtension: extension,
          mimeType: file.type,
          base64: base64String
        };

        statusText.innerText = "正在上傳至 Google 雲端儲存庫...";

        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          redirect: 'follow',
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success') {
            statusText.style.color = "#28a745";
            statusText.innerText = "🎉 上傳成功！清單已自動更新。";
            nameInput.value = ""; 
            fileInput.value = ""; 
            loadFileList(); 
          } else {
            statusText.style.color = "#dc3545";
            statusText.innerText = "❌ 上傳失敗：" + data.message;
          }
        })
        .catch(err => {
          console.error(err);
          statusText.style.color = "#dc3545";
          statusText.innerText = "❌ 連線失敗，請確認網址是否填寫正確。";
        });
      };
      
      reader.readAsDataURL(file);
    } // 👈 這裡修正為正確的函數閉合括號
  </script>
</body>
</html>
