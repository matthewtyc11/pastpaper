<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>試卷共享系統</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  display: flex;
  height: 100vh;
}

.left {
  width: 35%;
  padding: 20px;
  background: #f5f5f5;
  overflow-y: auto;
}

.right {
  width: 65%;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.file {
  padding: 10px;
  margin: 5px 0;
  background: white;
  cursor: pointer;
  border-left: 5px solid blue;
}

button {
  width: 100%;
  padding: 10px;
}
</style>
</head>

<body>

<div class="left">
  <h2>📤 上傳</h2>

  <input type="file" id="file"><br><br>
  <input type="text" id="name" placeholder="檔名"><br><br>
  <button onclick="upload()">上傳</button>

  <p id="msg"></p>

  <h2>📋 清單</h2>
  <div id="list">載入中...</div>
</div>

<div class="right" id="viewer">
  <p style="text-align:center;margin-top:40%;">點左邊查看</p>
</div>

<script src="app.js"></script>
</body>
</html>
